name: Aggregate Release
run-name: ${{ github.event_name == 'schedule' && 'Daily release-v0.1.0 preview' || format('Aggregate {0}', inputs.version) }}

on:
  push:
    branches:
      - agent/aggregate-artifact-transport-diagnostic
  workflow_dispatch:
    inputs:
      version:
        description: Aggregate version in release-vX.Y.Z or release-vX.Y.Z-preview.YYYYMMDD form
        required: true
        type: string
  schedule:
    - cron: "17 6 * * *"
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: aggregate-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  transport-stage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create read-only release token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator
          permission-contents: read

      - name: Download and verify accelerator release asset
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          VERSION: v0.1.0-preview.20260804
          ARCHIVE: accelerator-v0.1.0-preview.20260804-linux-x86_64.tar.gz
        run: |
          set -euo pipefail
          rm -rf transport-payload
          mkdir -p transport-payload
          release=$(gh api "repos/kuasar-sandbox/accelerator/releases/tags/$VERSION")
          asset=$(jq -ec --arg archive "$ARCHIVE" \
            '.assets[] | select(.name == $archive and .state == "uploaded")' <<< "$release")
          asset_id=$(jq -er '.id' <<< "$asset")
          expected_size=$(jq -er '.size' <<< "$asset")
          expected_digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$asset")
          started_ns=$(date +%s%N)
          curl --fail --show-error --silent --location \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 600 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/kuasar-sandbox/accelerator/releases/assets/$asset_id" \
            --output "transport-payload/$ARCHIVE"
          completed_ns=$(date +%s%N)
          actual_size=$(stat -c '%s' "transport-payload/$ARCHIVE")
          actual_digest="sha256:$(sha256sum "transport-payload/$ARCHIVE" | awk '{print $1}')"
          [ "$actual_size" = "$expected_size" ]
          [ "$actual_digest" = "$expected_digest" ]
          elapsed_seconds=$(awk -v start="$started_ns" -v end="$completed_ns" \
            'BEGIN { printf "%.3f", (end - start) / 1000000000 }')
          jq -n \
            --arg repository kuasar-sandbox/accelerator \
            --arg version "$VERSION" \
            --arg archive "$ARCHIVE" \
            --arg digest "$actual_digest" \
            --argjson size "$actual_size" \
            --argjson elapsedSeconds "$elapsed_seconds" \
            '{
              repository: $repository,
              version: $version,
              archive: $archive,
              digest: $digest,
              size: $size,
              hostedDownloadElapsedSeconds: $elapsedSeconds
            }' \
            > transport-payload/transport.json
          cat transport-payload/transport.json

      - name: Upload transport diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-transport-diagnostic-${{ github.run_id }}
          path: transport-payload
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  transport-bms:
    needs: transport-stage
    if: github.event_name == 'push'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kuasar-e2e
      - kvm
      - cgroup-v2
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Reset diagnostic workspace
        run: rm -rf transport-payload

      - name: Download staged release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-transport-diagnostic-${{ github.run_id }}
          path: transport-payload

      - name: Verify staged release asset
        run: |
          set -euo pipefail
          archive=$(jq -er '.archive' transport-payload/transport.json)
          expected_size=$(jq -er '.size' transport-payload/transport.json)
          expected_digest=$(jq -er '.digest' transport-payload/transport.json)
          actual_size=$(stat -c '%s' "transport-payload/$archive")
          actual_digest="sha256:$(sha256sum "transport-payload/$archive" | awk '{print $1}')"
          [ "$actual_size" = "$expected_size" ]
          [ "$actual_digest" = "$expected_digest" ]
          jq -n \
            --arg archive "$archive" \
            --arg digest "$actual_digest" \
            --argjson size "$actual_size" \
            '{archive: $archive, digest: $digest, size: $size, verified: true}'

      - name: Clean diagnostic workspace
        if: always()
        run: rm -rf transport-payload

  preflight:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      input_artifact: ${{ steps.input.outputs.artifact }}
      publish: ${{ steps.request.outputs.publish }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out trusted aggregate tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve aggregate request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Aggregate Release must run from main" >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/release-v0.1.0" >/dev/null 2>&1; then
              echo "version=release-v0.1.0" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            VERSION="release-v0.1.0-preview.$(TZ=Asia/Shanghai date -d "$created_at" +%Y%m%d)"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" > existing.json 2>/dev/null; then
              jq -e --arg version "$VERSION" \
                '.tag_name == $version and .draft == false and .prerelease == true' \
                existing.json >/dev/null
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            VERSION="$INPUT_VERSION"
          fi
          bash release-builder/scripts/publish-release.sh check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Create read-only component token
        id: source-token
        if: steps.request.outputs.publish == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,guest-runtime,orchestrator,sandboxer
          permission-contents: read
          skip-token-revoke: true

      - name: Define scheduled aggregate mapping
        if: github.event_name == 'schedule' && steps.request.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          date=${VERSION##*.}
          component_tags=(
            "kuasar-sandbox/accelerator v0.1.0-preview.$date"
            "kuasar-sandbox/connector v0.1.0-preview.$date"
            "kuasar-sandbox/sandboxer v0.1.0-preview.$date"
            "kuasar-sandbox/orchestrator v0.1.0-preview.$date"
            "kuasar-sandbox/guest-runtime runtime-v0.1.0-preview.$date"
            "kuasar-sandbox/guest-runtime vmlinux-v0.1.0-preview.$date"
          )
          ready=false
          for attempt in $(seq 1 120); do
            missing=()
            for entry in "${component_tags[@]}"; do
              read -r repository tag <<< "$entry"
              if ! GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$repository/releases/tags/$tag" \
                --jq 'select(.draft == false and .prerelease == true) | .tag_name' \
                | grep -Fx "$tag" >/dev/null; then
                missing+=("$repository@$tag")
              fi
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              ready=true
              break
            fi
            printf 'Waiting for daily component previews (attempt %d/120): %s\n' \
              "$attempt" "${missing[*]}"
            sleep 60
          done
          [ "$ready" = true ] || { echo "Daily component previews did not become ready" >&2; exit 1; }
          jq -n \
            --arg version "$VERSION" \
            --arg accelerator "v0.1.0-preview.$date" \
            --arg connector "v0.1.0-preview.$date" \
            --arg sandboxer "v0.1.0-preview.$date" \
            --arg orchestrator "v0.1.0-preview.$date" \
            --arg runtime "runtime-v0.1.0-preview.$date" \
            --arg vmlinux "vmlinux-v0.1.0-preview.$date" '
              {
                schemaVersion: 1,
                version: $version,
                architecture: "x86_64",
                components: {
                  accelerator: $accelerator,
                  connector: $connector,
                  sandboxer: $sandboxer,
                  orchestrator: $orchestrator,
                  runtime: $runtime,
                  vmlinux: $vmlinux
                }
              }
            ' > mapping.json
          bash release-builder/scripts/release-map.sh put mapping.json

      - name: Resolve release mapping and component releases
        id: input
        if: steps.request.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^release-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[0-9]{8})?$ ]] \
            || { echo "version must match release-vX.Y.Z or release-vX.Y.Z-preview.YYYYMMDD" >&2; exit 1; }
          path="releases/$VERSION.json"
          mapping_commit=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits?sha=release&path=$path&per_page=1" \
            --jq '.[0].sha')
          [[ "$mapping_commit" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "cannot resolve $path on the release branch" >&2; exit 1; }
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$path?ref=$mapping_commit" > mapping.json
          rm -rf release-input
          bash release-builder/scripts/aggregate-release.sh \
            resolve mapping.json "$mapping_commit" release-input
          artifact="aggregate-input-${VERSION}-${GITHUB_RUN_ID}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Revoke component token
        if: ${{ always() && steps.source-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          curl --fail --show-error --silent \
            --request DELETE \
            --output /dev/null \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/token

      - name: Upload resolved aggregate input
        if: steps.request.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.input.outputs.artifact }}
          path: release-input
          if-no-files-found: error
          retention-days: 7

  bms:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/bms-e2e.yml
    with:
      release_input_artifact: ${{ needs.preflight.outputs.input_artifact }}
    secrets: inherit

  publish:
    needs:
      - preflight
      - bms
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download BMS-validated aggregate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bms.outputs.release_artifact }}
          path: release-bundle

      - name: Publish aggregate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-builder/scripts/publish-release.sh publish release-bundle
