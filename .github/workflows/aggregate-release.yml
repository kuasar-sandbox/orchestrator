name: Aggregate Release
run-name: ${{ github.event_name == 'schedule' && 'Daily release-v0.1.0 preview' || format('Aggregate {0}', inputs.version) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Aggregate version in release-vX.Y.Z or release-vX.Y.Z-preview.YYYYMMDD form
        required: true
        type: string
  schedule:
    - cron: "47 3 * * *"
      timezone: Asia/Shanghai
    - cron: "17 6 * * *"
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: aggregate-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      input_artifact: ${{ steps.input.outputs.artifact }}
      assets_artifact: ${{ steps.assets.outputs.artifact }}
      publish: ${{ steps.request.outputs.publish }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out trusted aggregate tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve aggregate request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Aggregate Release must run from main" >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/release-v0.1.0" >/dev/null 2>&1; then
              echo "version=release-v0.1.0" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            VERSION="release-v0.1.0-preview.$(TZ=Asia/Shanghai date -d "$created_at" +%Y%m%d)"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" > existing.json 2>/dev/null; then
              jq -e --arg version "$VERSION" \
                '.tag_name == $version and .draft == false and .prerelease == true' \
                existing.json >/dev/null
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            VERSION="$INPUT_VERSION"
          fi
          bash release-builder/scripts/publish-release.sh check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Create read-only component token
        id: source-token
        if: steps.request.outputs.publish == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,guest-runtime,orchestrator,sandboxer
          permission-contents: read
          skip-token-revoke: true

      - name: Define scheduled aggregate mapping
        if: github.event_name == 'schedule' && steps.request.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          date=${VERSION##*.}
          component_tags=(
            "kuasar-sandbox/accelerator v0.1.0-preview.$date"
            "kuasar-sandbox/connector v0.1.0-preview.$date"
            "kuasar-sandbox/sandboxer v0.1.0-preview.$date"
            "kuasar-sandbox/orchestrator v0.1.0-preview.$date"
            "kuasar-sandbox/guest-runtime runtime-v0.1.0-preview.$date"
            "kuasar-sandbox/guest-runtime vmlinux-v0.1.0-preview.$date"
          )
          ready=false
          for attempt in $(seq 1 120); do
            missing=()
            for entry in "${component_tags[@]}"; do
              read -r repository tag <<< "$entry"
              if ! GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$repository/releases/tags/$tag" \
                --jq 'select(.draft == false and .prerelease == true) | .tag_name' \
                | grep -Fx "$tag" >/dev/null; then
                missing+=("$repository@$tag")
              fi
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              ready=true
              break
            fi
            printf 'Waiting for daily component previews (attempt %d/120): %s\n' \
              "$attempt" "${missing[*]}"
            sleep 60
          done
          [ "$ready" = true ] || { echo "Daily component previews did not become ready" >&2; exit 1; }
          jq -n \
            --arg version "$VERSION" \
            --arg accelerator "v0.1.0-preview.$date" \
            --arg connector "v0.1.0-preview.$date" \
            --arg sandboxer "v0.1.0-preview.$date" \
            --arg orchestrator "v0.1.0-preview.$date" \
            --arg runtime "runtime-v0.1.0-preview.$date" \
            --arg vmlinux "vmlinux-v0.1.0-preview.$date" '
              {
                schemaVersion: 1,
                version: $version,
                architecture: "x86_64",
                components: {
                  accelerator: $accelerator,
                  connector: $connector,
                  sandboxer: $sandboxer,
                  orchestrator: $orchestrator,
                  runtime: $runtime,
                  vmlinux: $vmlinux
                }
              }
            ' > mapping.json
          bash release-builder/scripts/release-map.sh put mapping.json

      - name: Resolve release mapping and component releases
        id: input
        if: steps.request.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^release-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[0-9]{8})?$ ]] \
            || { echo "version must match release-vX.Y.Z or release-vX.Y.Z-preview.YYYYMMDD" >&2; exit 1; }
          path="releases/$VERSION.json"
          mapping_commit=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits?sha=release&path=$path&per_page=1" \
            --jq '.[0].sha')
          [[ "$mapping_commit" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "cannot resolve $path on the release branch" >&2; exit 1; }
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$path?ref=$mapping_commit" > mapping.json
          rm -rf release-input
          bash release-builder/scripts/aggregate-release.sh \
            resolve mapping.json "$mapping_commit" release-input
          artifact="aggregate-input-${VERSION}-${GITHUB_RUN_ID}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Download exact component release assets
        id: assets
        if: steps.request.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          bash release-builder/scripts/aggregate-release.sh \
            fetch-assets release-input/resolved.json release-assets
          artifact="aggregate-assets-${VERSION}-${GITHUB_RUN_ID}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Revoke component token
        if: ${{ always() && steps.source-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          curl --fail --show-error --silent \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request DELETE \
            --output /dev/null \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/token

      - name: Upload resolved aggregate input
        if: steps.request.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.input.outputs.artifact }}
          path: release-input
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact component release assets
        if: steps.request.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.assets.outputs.artifact }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  bms:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/bms-e2e.yml
    with:
      release_input_artifact: ${{ needs.preflight.outputs.input_artifact }}
      release_assets_artifact: ${{ needs.preflight.outputs.assets_artifact }}
    secrets: inherit

  publish:
    needs:
      - preflight
      - bms
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download BMS-validated aggregate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bms.outputs.release_artifact }}
          path: release-bundle

      - name: Publish aggregate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-builder/scripts/publish-release.sh publish release-bundle
