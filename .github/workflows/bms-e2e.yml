name: BMS E2E

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  bms:
    uses: kuasar-sandbox/platform/.github/workflows/bms-entry.yml@main
    secrets:
      KUASAR_CI_APP_PRIVATE_KEY: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
