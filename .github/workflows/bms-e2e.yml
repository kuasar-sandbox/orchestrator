name: BMS E2E

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: Type run-full-e2e to start the full BMS suite
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bms-e2e-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.confirm == 'run-full-e2e')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kuasar-e2e
      - kvm
      - cgroup-v2
    timeout-minutes: 30
    env:
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      KUASAR_CI_DIR: ${{ github.workspace }}/ci-metrics/${{ github.run_id }}-${{ github.run_attempt }}
      KUASAR_CI_TIMINGS: ${{ github.workspace }}/ci-metrics/${{ github.run_id }}-${{ github.run_attempt }}/timings.tsv
      KUASAR_NATIVE_CACHE_METRICS: ${{ github.workspace }}/ci-metrics/${{ github.run_id }}-${{ github.run_attempt }}/native-cache.tsv
      KUASAR_REVISION_MANIFEST: ${{ github.workspace }}/ci-metrics/${{ github.run_id }}-${{ github.run_attempt }}/revisions.tsv
      KUASAR_SOURCE_CACHE_MAX_ENTRIES: "32"
      KUASAR_NATIVE_CACHE_MAX_ENTRIES: "4"

    steps:
      - name: Initialize CI metadata
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          rm -rf "${KUASAR_CI_DIR%/*}"
          mkdir -p "$KUASAR_CI_DIR"
          printf 'event_name\tcandidate_repository\tcandidate_event_sha\tcandidate_head_sha\n' \
            > "$KUASAR_CI_DIR/run.tsv"
          printf '%s\t%s\t%s\t%s\n' \
            "${{ github.event_name }}" "$CANDIDATE_REPOSITORY" "$CANDIDATE_SHA" "$CANDIDATE_HEAD_SHA" \
            >> "$KUASAR_CI_DIR/run.tsv"

      - name: Reset interrupted E2E state
        run: |
          set -euo pipefail

          privileged=()
          if [ "$(id -u)" -ne 0 ]; then
            privileged=(sudo -n)
          fi

          "${privileged[@]}" systemctl stop 'sandbox-runner@*.service' 'sandbox-builder@*.service'
          if ip link show sb-tap0 >/dev/null 2>&1; then
            "${privileged[@]}" ip link del sb-tap0
          fi
          "${privileged[@]}" rm -f \
            /run/systemd/system/sandbox-runner@.service \
            /run/systemd/system/sandbox-builder@.service \
            /run/systemd/system/sandbox-runner.slice \
            /run/systemd/system/sandbox-builder.slice
          "${privileged[@]}" systemctl reset-failed 'sandbox-runner@*.service' 'sandbox-builder@*.service'
          "${privileged[@]}" systemctl daemon-reload

      - name: Create source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,guest-runtime,orchestrator,sandboxer
          permission-contents: read

      - name: Assemble the five-repository workspace
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          repos=(accelerator connector guest-runtime orchestrator sandboxer)
          archive_tmp=""
          checksum_tmp=""
          zip_tmp=""
          zip_stage=""
          trap 'rm -f "${archive_tmp:-}" "${checksum_tmp:-}" "${zip_tmp:-}"; rm -rf "${zip_stage:-}"' EXIT
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          started_ns=$(date +%s%N)
          printf 'repository\trequested_ref\tresolved_sha\trole\n' > "$KUASAR_REVISION_MANIFEST"
          printf 'repository\tresolved_sha\tstatus\tsha256\n' > "$KUASAR_CI_DIR/source-cache.tsv"
          rm -rf src

          revision_query='
          query {
            accelerator: repository(owner: "kuasar-sandbox", name: "accelerator") {
              ref(qualifiedName: "refs/heads/main") { target { oid } }
            }
            connector: repository(owner: "kuasar-sandbox", name: "connector") {
              ref(qualifiedName: "refs/heads/main") { target { oid } }
            }
            guest_runtime: repository(owner: "kuasar-sandbox", name: "guest-runtime") {
              ref(qualifiedName: "refs/heads/main") { target { oid } }
            }
            orchestrator: repository(owner: "kuasar-sandbox", name: "orchestrator") {
              ref(qualifiedName: "refs/heads/main") { target { oid } }
            }
            sandboxer: repository(owner: "kuasar-sandbox", name: "sandboxer") {
              ref(qualifiedName: "refs/heads/main") { target { oid } }
            }
          }'
          revision_response=$(jq -cn --arg query "$revision_query" '{query: $query}' \
            | curl --fail --show-error --silent \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @- https://api.github.com/graphql)
          if ! jq -e '
            .errors == null
            and ([
              .data.accelerator.ref.target.oid,
              .data.connector.ref.target.oid,
              .data.guest_runtime.ref.target.oid,
              .data.orchestrator.ref.target.oid,
              .data.sandboxer.ref.target.oid
            ] | all(type == "string" and test("^[0-9a-f]{40}$")))
          ' <<< "$revision_response" >/dev/null; then
            echo "GitHub GraphQL did not return the complete five-repository revision set" >&2
            jq -c '{errors, data}' <<< "$revision_response" >&2 || true
            exit 1
          fi

          for repo in "${repos[@]}"; do
            requested_ref=main
            role=sibling
            if [[ "kuasar-sandbox/$repo" == "$CANDIDATE_REPOSITORY" ]]; then
              requested_ref="$CANDIDATE_SHA"
              resolved_sha="$CANDIDATE_SHA"
              role=candidate
            else
              revision_key=$repo
              if [ "$repo" = guest-runtime ]; then
                revision_key=guest_runtime
              fi
              resolved_sha=$(jq -r --arg key "$revision_key" \
                '.data[$key].ref.target.oid // empty' <<< "$revision_response")
            fi
            [[ "$resolved_sha" =~ ^[0-9a-f]{40}$ ]]
            printf 'kuasar-sandbox/%s\t%s\t%s\t%s\n' \
              "$repo" "$requested_ref" "$resolved_sha" "$role" >> "$KUASAR_REVISION_MANIFEST"

            source_dir="/var/cache/kuasar/sources/$repo"
            archive="$source_dir/$resolved_sha.tar.gz"
            checksum="$archive.sha256"
            lock="$source_dir/.cache.lock"
            install -d -m 0755 "$source_dir"
            exec {source_lock_fd}>"$lock"
            flock "$source_lock_fd"
            cache_status=hit
            if ! [ -s "$archive" ] || ! [ -s "$checksum" ] \
              || ! (cd "$source_dir" && sha256sum --quiet -c "$(basename "$checksum")") \
              || ! tar -tzf "$archive" >/dev/null; then
              cache_status=miss
              archive_tmp="$archive.$$.tmp"
              checksum_tmp="$checksum.$$.tmp"
              zip_tmp="$archive.$$.zip.tmp"
              zip_stage="$source_dir/.zip-stage.$$"
              rm -f "$archive_tmp" "$checksum_tmp" "$zip_tmp"
              rm -rf "$zip_stage"
              if ! curl --fail --show-error --silent --location \
                --retry 4 --retry-all-errors --connect-timeout 10 --max-time 120 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/kuasar-sandbox/$repo/tarball/$resolved_sha" \
                -o "$archive_tmp"; then
                cache_status=miss-zip-fallback
                rm -f "$archive_tmp"
                curl --fail --show-error --silent --location \
                  --retry 4 --retry-all-errors --connect-timeout 10 --max-time 120 \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/kuasar-sandbox/$repo/zipball/$resolved_sha" \
                  -o "$zip_tmp"
                install -d -m 0755 "$zip_stage"
                unzip -q "$zip_tmp" -d "$zip_stage"
                mapfile -d '' zip_roots < <(find "$zip_stage" -mindepth 1 -maxdepth 1 -print0)
                [ "${#zip_roots[@]}" -eq 1 ] && [ -d "${zip_roots[0]}" ]
                tar -czf "$archive_tmp" -C "$zip_stage" "$(basename "${zip_roots[0]}")"
                rm -f "$zip_tmp"
                rm -rf "$zip_stage"
                zip_tmp=""
                zip_stage=""
              fi
              tar -tzf "$archive_tmp" >/dev/null
              archive_sha=$(sha256sum "$archive_tmp" | awk '{print $1}')
              printf '%s  %s\n' "$archive_sha" "$(basename "$archive")" > "$checksum_tmp"
              chmod a-w "$archive_tmp" "$checksum_tmp"
              rm -f "$archive" "$checksum"
              mv "$archive_tmp" "$archive"
              mv "$checksum_tmp" "$checksum"
              archive_tmp=""
              checksum_tmp=""
            fi
            archive_sha=$(sha256sum "$archive" | awk '{print $1}')
            touch "$archive" "$checksum"
            mkdir -p "src/$repo"
            tar -xzf "$archive" --strip-components=1 -C "src/$repo"
            flock -u "$source_lock_fd"
            exec {source_lock_fd}>&-
            printf '%s\t%s\t%s\t%s\n' "$repo" "$resolved_sha" "$cache_status" "$archive_sha" \
              >> "$KUASAR_CI_DIR/source-cache.tsv"
          done

          while IFS=$'\t' read -r repository _ resolved_sha _; do
            repo=${repository#kuasar-sandbox/}
            source_dir="/var/cache/kuasar/sources/$repo"
            src/orchestrator/release-builder/scripts/source-cache-prune.sh \
              "$source_dir" "$source_dir/$resolved_sha.tar.gz"
          done < <(tail -n +2 "$KUASAR_REVISION_MANIFEST")

          cd src
          go work init ./accelerator ./connector ./guest-runtime ./orchestrator ./sandboxer
          cd ..
          elapsed=$(awk -v start="$started_ns" -v end="$(date +%s%N)" \
            'BEGIN { printf "%.3f", (end - start) / 1000000000 }')
          printf 'stage\tstarted_at\telapsed_seconds\tuser_seconds\tsystem_seconds\tcpu_percent\tmax_rss_kb\tfs_input\tfs_output\texit_code\n' \
            > "$KUASAR_CI_TIMINGS"
          printf 'workflow/assemble\t%s\t%s\tunavailable\tunavailable\tunavailable\tunavailable\tunavailable\tunavailable\t0\n' \
            "$started_at" "$elapsed" >> "$KUASAR_CI_TIMINGS"

      - name: Attach runner caches
        run: |
          set -euo pipefail

          install -d -m 0755 /var/cache/kuasar/tarballs
          for path in \
            src/accelerator/build/tarball \
            src/guest-runtime/native-deps/build/tarball \
            src/sandboxer/native-deps/build/tarball
          do
            mkdir -p "$(dirname "$path")"
            ln -sfn /var/cache/kuasar/tarballs "$path"
          done

          linux_file=$(awk '/^LINUX_TARBALL[[:space:]]*\?=/ { url=$3; sub(/\\#.*/, "", url); n=split(url, part, "/"); print part[n]; exit }' src/guest-runtime/native-deps/Makefile)
          [[ "$linux_file" =~ ^linux-([0-9]+)\..*\.tar\.gz$ ]]
          echo "LINUX_TARBALL=https://mirrors.tuna.tsinghua.edu.cn/kernel/v${BASH_REMATCH[1]}.x/$linux_file" >> "$GITHUB_ENV"

          for image in python:3.12-slim python:3.12-alpine alpine:3.19 alpine:3.20 busybox:latest; do
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              mirror="m.daocloud.io/docker.io/library/$image"
              timeout 3m docker pull "$mirror"
              docker tag "$mirror" "$image"
            fi
          done

          tool_dir=src/orchestrator/release-builder/build/e2e-tools/x86_64
          mkdir -p "$tool_dir"
          ln -sfn /var/lib/kuasar-ci/tools/zot "$tool_dir/zot"
          ln -sfn /var/lib/kuasar-ci/tools/versitygw "$tool_dir/versitygw"

      - name: Restore or build verified native artifacts
        working-directory: src/orchestrator/release-builder
        run: scripts/native-cache.sh restore-or-build

      - name: Build and test the platform
        working-directory: src/orchestrator/release-builder
        run: make test-e2e

      - name: Upload revision and timing metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KUASAR_CI_DIR }}
          if-no-files-found: warn
          retention-days: 30
