name: Component Release
run-name: ${{ github.event_name == 'schedule' && 'Daily orchestrator v0.1.0 preview' || format('Release orchestrator {0}', inputs.version) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Orchestrator version in vX.Y.Z or vX.Y.Z-preview.YYYYMMDD form
        required: true
        type: string
  schedule:
    - cron: "27 2 * * *"
      timezone: Asia/Shanghai
    - cron: "27 4 * * *"
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: component-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.request.outputs.publish }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Component Release must run from main" >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" >/dev/null 2>&1; then
              echo "version=v0.1.0" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            VERSION="v0.1.0-preview.$(TZ=Asia/Shanghai date -d "$created_at" +%Y%m%d)"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" > existing.json 2>/dev/null; then
              jq -e --arg version "$VERSION" \
                '.tag_name == $version and .draft == false and .prerelease == true' \
                existing.json >/dev/null
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            VERSION="$INPUT_VERSION"
          fi
          bash release-builder/scripts/publish-component-release.sh check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kuasar-e2e
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET_ARCH: x86_64
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
      http_proxy: ${{ secrets.KUASAR_CI_PROXY_URL }}
      https_proxy: ${{ secrets.KUASAR_CI_PROXY_URL }}
      no_proxy: ${{ vars.KUASAR_CI_NO_PROXY }}
    steps:
      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,orchestrator,sandboxer
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact orchestrator source
        id: checkout-orchestrator
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/orchestrator
          ref: ${{ github.sha }}
          path: src/orchestrator
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry exact orchestrator source checkout
        if: steps.checkout-orchestrator.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/orchestrator
          ref: ${{ github.sha }}
          path: src/orchestrator
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out accelerator dependency
        id: checkout-accelerator
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/accelerator
          ref: main
          path: src/accelerator
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry accelerator dependency checkout
        if: steps.checkout-accelerator.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/accelerator
          ref: main
          path: src/accelerator
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out connector dependency
        id: checkout-connector
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/connector
          ref: main
          path: src/connector
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry connector dependency checkout
        if: steps.checkout-connector.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/connector
          ref: main
          path: src/connector
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out sandboxer dependency
        id: checkout-sandboxer
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/sandboxer
          ref: main
          path: src/sandboxer
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry sandboxer dependency checkout
        if: steps.checkout-sandboxer.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/sandboxer
          ref: main
          path: src/sandboxer
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Revoke source token before code execution
        if: ${{ always() && steps.source-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          curl --fail --show-error --silent \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request DELETE \
            --output /dev/null \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/token

      - name: Assemble source workspace
        run: |
          set -euo pipefail
          rm -f go.work go.work.sum
          go work init ./src/accelerator ./src/connector ./src/orchestrator ./src/sandboxer

      - name: Build and test orchestrator
        working-directory: src/orchestrator
        run: |
          set -euo pipefail
          make test
          make vet
          make build

      - name: Package the component release
        working-directory: src/orchestrator
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_WORKFLOW_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          RELEASE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf 'repository\trequested_ref\tresolved_sha\trole\n'
            printf 'kuasar-sandbox/accelerator\tmain\t%s\tdependency\n' \
              "$(git -C ../accelerator rev-parse HEAD)"
            printf 'kuasar-sandbox/connector\tmain\t%s\tdependency\n' \
              "$(git -C ../connector rev-parse HEAD)"
            printf 'kuasar-sandbox/orchestrator\tmain\t%s\tprimary\n' \
              "$(git rev-parse HEAD)"
            printf 'kuasar-sandbox/sandboxer\tmain\t%s\tdependency\n' \
              "$(git -C ../sandboxer rev-parse HEAD)"
          } > revisions.tsv
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          bash release-builder/scripts/component-release.sh \
            package "$VERSION" "$TARGET_ARCH" revisions.tsv release-bundle

      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchestrator-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: src/orchestrator/release-bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orchestrator-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: release-bundle

      - name: Publish orchestrator release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-builder/scripts/publish-component-release.sh publish release-bundle
