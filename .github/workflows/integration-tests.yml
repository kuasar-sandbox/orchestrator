name: Integration E2E

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  ci:
    uses: kuasar-sandbox/kuasar-sandbox/.github/workflows/ci-entry.yml@main
    secrets:
      KUASAR_CI_APP_PRIVATE_KEY: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
