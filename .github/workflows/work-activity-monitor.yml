name: Work activity monitor

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, assigned, labeled, unlabeled, milestoned, demilestoned]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, closed, reopened, ready_for_review, converted_to_draft, review_requested, review_request_removed, assigned, labeled, unlabeled, milestoned, demilestoned]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  discussion:
    types: [created, edited, answered, unanswered, labeled, unlabeled, category_changed]
  discussion_comment:
    types: [created, edited]
  milestone:
    types: [created, opened, edited, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  discussions: read

jobs:
  monitor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Detect actionable activity
        uses: kuasar-sandbox/.github/.github/actions/work-activity-monitor@596aa5dee39646242ce661a350df9649c00bf576
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          recipient: fullof-work
