# cluster-ctl placer config — run-cluster-ctl placer --config /etc/cluster-ctl/placer.yaml.
# Optional Group importer (docs/cluster.md#placer-configuration): it starts from registry
# membership, joins the placer memberlist, consumes node_list, and maintains
# Node-owned Group definitions and credential leases.
# Validate with `cluster-ctl config placer --config placer.yaml`.

placer:
  id: placer-1
  listen: ":7800"
  advertise: "http://placer-1.example:7800"
  memberlist_label: placer.default
  # tls: { cert: ..., key: ..., ca: ... }   # server mTLS; then use https:// advertise

registry:
  bootstrap: registry-1.example:7700
  # tls: { cert: ..., key: ..., ca: ... }   # client mTLS to registry control plane

import_groups:
  - source_id: example-file-source
    source_type: file
    path: /var/lib/kuasar/groups

placement:
  import_source_owner_count: 3        # candidates that may race for each source lease
  import_source_lease_ttl: 15s        # registry-side source lease TTL
  import_refresh_interval: 1m        # reconcile Groups and renew unchanged bindings
  # shuffle_sharding: pin matching groups to n deterministic shards of the node set,
  # bucketed by a node label. Empty = static nodeSelectors only.
  # shuffle_sharding:
  #   - selector: { pool: gpu }
  #     shard_by: zone
  #     n: 2
