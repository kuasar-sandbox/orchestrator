# cluster-ctl placer --config /etc/cluster-ctl/placer.yaml
placer:
  id: placer-1
  listen: ":7800"
  tls:
    cert: /etc/kuasar/tls/placer-1.crt
    key: /etc/kuasar/tls/placer-1.key
    ca: /etc/kuasar/tls/ca.crt

group_sources:
  - source_id: groups-primary
    source_type: file
    path: /var/lib/kuasar/groups

placement:
  candidates: 4
