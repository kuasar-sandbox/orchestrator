# node-ctl proxy master config — node-ctl proxy serve --config /etc/node-ctl/proxy.yaml.
# Used only in external data-plane mode (conductor.yaml proxy.mode: external). A
# single master registers on conductor's plugin plane, owns listener sockets, and
# supervises worker processes that read a shared-memory route table.
# See orchestrator/docs/node-proxy.md §2. Validate with
# `node-ctl config proxy --config proxy.yaml`.

# serve's control socket: the master registers on its plugin plane and streams the
# route table from it (= serve paths.config_socket).
config_socket: /run/sandbox/node-ctl.socket

# Sandbox runtime root. Workers use <run_root>/<sid>/ctl.sock for native exec.
# Configure this locally on the proxy; it is not projected over route sync.
paths:
  # Optional statically customized external-proxy App. Used only for node-ctl ->
  # master dispatch; every worker reexecs the master's current executable and
  # receives a frozen config snapshot, so workers never reread this YAML.
  # Runtime owner policy accepts root ownership or, for non-root node-ctl, its
  # effective UID; group/world-writable files are always rejected.
  # proxy_executable: /opt/kuasar/bin/xproxy
  run_root: /run/sandbox

# Data-plane ingress. The master binds once and passes the same listener fd to all
# workers. "" = serve only proxy-forwards over proxy_socket.
data_listen: ":443"

# Forwarding plane netns. Set this to the connector --mgmt-extract netns so workers'
# floatingip dials and the conductor-projected MMDS listener live with the vswitch
# management plane. data_listen stays in the master process's current netns.
# proxy_netns: sw0_mgmt

proxy_socket: /run/sandbox/proxy.sock
stats_socket: /run/sandbox/proxy-stats.sock
shm_path: /run/sandbox/proxy-routes.shm
route_capacity: 65536
workers: 2

# Data-plane listener cert — the same wildcard cert serve presents (*.<domain>).
# Omit for h2c (dev / when fronted by a TLS terminator).
tls:
  cert: /etc/node-ctl/tls/fullchain.pem
  key: /etc/node-ctl/tls/privkey.pem

# Bootstrap fallbacks, used only until serve pushes its authoritative policy over the
# registration handshake: auth = X-Access-Token check (off|log|enforce), park_timeout
# bounds how long a request is held awaiting route/resume.
auth: enforce
park_timeout: 30s

# metrics_listen: 127.0.0.1:9095 # master metrics endpoint (aggregates worker counters)
