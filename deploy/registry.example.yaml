# Registry config — run-cluster-ctl registry --config /etc/cluster-ctl/registry.yaml.
# Validate with `run-cluster-ctl config registry --config registry.yaml`.

member:
  id: registry-1
  listen: ":7700"
  # tls: { cert: ..., key: ..., ca: ... }   # server mTLS

membership:
  active: 1
  # next: 2                         # additional business connection candidates during membership change
  # old_grace: 1                    # previous version kept as peer/node_link ingress after cutover
  reload_ready_timeout: 10s
  versions:
    - version: 1
      members:
        - { id: registry-1, advertise: "https://registry-1.example:7700", node_advertise: "registry-1.example:7700" }
  owners:
    route_link: 1
    node_link: 1
    placer_link: 1
    node_list: 1

node_link:
  # listen: ""                         # optional split listener for node streams; empty = member.listen
  heartbeat_interval: 10s
  node_dead_after: 30s

route_link:
  park_timeout: 30s

# All Registry members use the same external database and isolated key prefix.
foundationdb:
  cluster_file: /etc/foundationdb/fdb.cluster
  prefix: kuasar-sandbox/cluster/

placer_link:
  placer_label: placer.default

placement:
  candidates: 2                       # Registry P2C sample size
  zone_admit_max: yellow               # exclude nodes hotter than this (green|yellow|red)
