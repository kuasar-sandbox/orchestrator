# cluster-ctl registry config — cluster-ctl registry --config /etc/cluster-ctl/registry.yaml.
# Validate with `cluster-ctl config registry --config registry.yaml`.

member:
  id: registry-1
  listen: ":7700"
  # tls: { cert: ..., key: ..., ca: ... }   # server mTLS

membership:
  active: 1
  # next: 2                         # joint owner set target during membership change
  # old_grace: 1                    # previous version kept as peer/node_link ingress after cutover
  reload_ready_timeout: 10s
  versions:
    - version: 1
      members:
        - { id: registry-1, advertise: "https://registry-1.example:7700", node_advertise: "registry-1.example:7700" }
  owners:
    route_link: 1
    node_link: 1
    scale_link: 1
    node_list: 1

node_link:
  # listen: ""                         # optional split listener for node streams; empty = member.listen
  heartbeat_interval: 10s
  node_dead_after: 30s

route_link:
  park_timeout: 30s

node_list:
  watch_retention: 10000

scale_link:
  scaler_label: scaler.default
  scaler_replica_count: 3
  min_ready_scalers: 1
  place_timeout: 2s
