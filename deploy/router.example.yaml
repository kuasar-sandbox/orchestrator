# cluster-ctl router config — cluster-ctl router --config /etc/cluster-ctl/router.yaml.
# e2b-compatible unified ingress (docs/cluster-router.md). Required: domain.
# Validate with `cluster-ctl config router --config router.yaml`.

domain: sandboxes.example.com

# Upstream: registry bootstrap endpoint. Router fetches membership, then routes
# each group operation to the route_link owner set.
registry:
  bootstrap: registry-1.example:7700
  # tls: { cert: ..., key: ..., ca: ... }   # client mTLS to registry control plane

# Downstream: the client-facing e2b ingress (SO_REUSEPORT across replicas).
ingress:
  listen: ":443"
  # tls: { cert: /etc/cluster-ctl/tls/fullchain.pem, key: /etc/cluster-ctl/tls/privkey.pem }  # wildcard *.<domain> + api.<domain>

auth:
  api_key: enforce                    # caller api_key auth: off | log | enforce
  data_plane: enforce                 # data-plane access-token check: off | log | enforce
  cache_ttl: 60s                      # api_key↔group verification cache

cache:
  route_ttl: 5m                       # local route resolution max age
  idle_timeout: 2m                    # active/route cache idle age

# metrics_listen: ":9910"             # optional Prometheus text endpoint
