# cluster-ctl router --config /etc/cluster-ctl/router.yaml
domain: sandboxes.example.com

registry_layout:
  chain: /etc/kuasar/registry-layout-chain.json
  keys: /etc/kuasar/registry-layout-keyring.json
  guard: /var/lib/kuasar/router/registry-layout-guard.json

registry_tls:
  cert: /etc/kuasar/tls/router.crt
  key: /etc/kuasar/tls/router.key
  ca: /etc/kuasar/tls/ca.crt

# Router presents this role certificate to each bound node for direct Sandbox
# control, Build lifecycle, and CONNECT forwarding. Nodes require the same CA.
node_tls:
  cert: /etc/kuasar/tls/router.crt
  key: /etc/kuasar/tls/router.key
  ca: /etc/kuasar/tls/ca.crt

providers:
  endpoints:
    - { name: provider-1, endpoint: "https://provider-1.example:7900" }
  tls:
    cert: /etc/kuasar/tls/router.crt
    key: /etc/kuasar/tls/router.key
    ca: /etc/kuasar/tls/ca.crt

ingress:
  listen: ":443"
  tls:
    cert: /etc/kuasar/tls/wildcard.crt
    key: /etc/kuasar/tls/wildcard.key

auth:
  api_key: enforce
  data_plane: enforce
  cache_ttl: 60s

cache:
  route_ttl: 5m
  idle_timeout: 2m

# metrics_listen: ":9910"
