# cluster-ctl scaler config — cluster-ctl scaler --config /etc/cluster-ctl/scaler.yaml.
# Standalone placement scheduler (cluster-scaler.md §3): it starts from registry
# membership, connects every active registry member, and provides placement for
# registry callers.
# Validate with `cluster-ctl config scaler --config scaler.yaml`.

member:
  id: scaler-1
  listen: ":7800"
  advertise: "https://scaler-1.example:7800"
  # tls: { cert: ..., key: ..., ca: ... }   # server mTLS for scaler Place API

registry:
  bootstrap: registry-1.example:7700
  # tls: { cert: ..., key: ..., ca: ... }   # client mTLS to registry control plane

# Sandbox-group records are imported into scaler/provider side, for example:
#   cluster-ctl scaler import --config scaler.yaml -i groups.jsonl

placement:
  candidates: 2                       # P2C sample size
  zone_admit_max: yellow              # exclude nodes hotter than this (green|yellow|red)
  node_dead_after: 30s                # exclude nodes silent longer than this
  # shuffle_sharding: pin matching groups to n deterministic shards of the node set,
  # bucketed by a node label (cluster-scaler.md §4.4). Empty = static nodeSelectors only.
  # shuffle_sharding:
  #   - selector: { pool: gpu }
  #     shard_by: zone
  #     n: 2
