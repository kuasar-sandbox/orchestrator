# Remote read + write. Enable remote-write reception and suitable retention on
# Prometheus; the query credential needs remote-read access independently.
config_socket: /run/sandbox/node-ctl.socket
# proxy_netns: sandbox-proxy
query:
  backend: prometheus
  handler: e2b
  lookback: 168h
  prometheus:
    endpoint: https://prometheus.example.com
    labels:
      sandbox.id: sandbox_id
      sandbox.stable_id: sandbox_stable_id
      sandbox.telemetry.source: sandbox_telemetry_source
  e2b:
    source: envd
    metrics:
      cpuCount: sandbox_cpu_count
      cpuUsedPct: sandbox_cpu_used
      memTotal: sandbox_memory_total
      memUsed: sandbox_memory_used
      memCache: sandbox_memory_cache
      diskTotal: sandbox_disk_total
      diskUsed: sandbox_disk_used
collector:
  receivers:
    envd: {collection_interval: 5s}
    sandboxstats: {resource_interval: 5s, traffic_interval: 10s, usage_interval: 1m}
    sandboxotlp: {http_listen: ':4318', grpc_listen: ':4317'}
  processors:
    batch: {timeout: 1s, send_batch_size: 8192, send_batch_max_size: 8192}
  exporters:
    prometheusremotewrite:
      endpoint: https://prometheus.example.com/api/v1/write
      add_metric_suffixes: false
      resource_to_telemetry_conversion: {enabled: true}
      remote_write_queue: {enabled: true, queue_size: 256, num_consumers: 1}
      retry_on_failure: {enabled: true, max_elapsed_time: 30s}
      target_info: {enabled: false}
  service:
    telemetry: {metrics: {level: none}}
    pipelines:
      metrics: {receivers: [envd, sandboxstats, sandboxotlp], processors: [batch], exporters: [prometheusremotewrite]}
